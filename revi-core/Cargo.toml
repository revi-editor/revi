[package]
name = "revi-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ropey = "1.6.1"
tokio = { version = "1.42.1", features = ["full"] }
tokio-tungstenite = "0.26.2"
tungstenite = "0.26.2"
futures = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
revi-protocol = { path = "../revi-protocol" }

[lib]
name = "revi_core"
path = "src/lib.rs"

[[bin]]
name = "revi_core"
path = "src/main.rs"
